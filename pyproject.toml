[tool.coverage.run]
branch = true
source = [ "./retag_opus/" ]

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_lines = [
    'import sys',
    'from retag_opus import app',
    'if __name__ == "__main__":',
    '    sys.exit(app.run())',
]

[tool.pyright]
pythonVersion = "3.13"
pythonPlatform = "Linux"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
exclude = "^tests/test_app.py"
disable_error_code = ["import-untyped"]

[tool.poetry]
name = "retag_opus"
version = "0.4.1"
description = "An app to tag music files downloaded from Youtube with all the information available in the Youtube description."
authors = ["Simon Bengtsson <gevhaz@tutanota.com>"]
license = "GPL-3.0-or-later"
readme = "README.md"

[tool.poetry.scripts]
retag = "retag_opus.app:run"

[tool.poetry.dependencies]
python = "^3.13"
mutagen = "^1.45.1"
simple-term-menu = "^1.4.1"
shtab = "^1.5.4"

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
isort = {version = "^5.10.1", extras = ["colors"]}
mypy = "^1.6.0"
flake8 = "^7.1"
flake8-docstrings = "^1.6.0"
coverage = "^7.6"
pytest-cov = "^6.0"
mock = "^4.0.3"
types-mock = "^4.0.15"
pytest = "^7.2.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
