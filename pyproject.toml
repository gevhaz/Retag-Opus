[project]
name = "retag_opus"
version = "0.5.0"
description = "An app to tag music files downloaded from Youtube with all the information available in the Youtube description."
authors = [{ name = "Simon Bengtsson", email = "gevhaz@tutanota.com" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mutagen>=1.45.1",
    "simple-term-menu>=1.4.1",
    "shtab>=1.5.4",
]

[project.scripts]
retag = "retag_opus.app:run"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort[colors]>=9.0.2",
    "mypy>=2.4.0",
    "flake8>=7.1",
    "flake8-docstrings>=1.6.0",
    "coverage>=7.6",
    "pytest-cov>=7.1.0",
    "pytest>=9.1.1",
]

[tool.coverage.run]
branch = true
source = [ "./src/retag_opus/" ]

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_lines = [
    'import sys',
    'from retag_opus import app',
    'if __name__ == "__main__":',
    '    sys.exit(app.run())',
]

[tool.pyright]
pythonVersion = "3.13"
pythonPlatform = "Linux"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
exclude = "^tests/test_app.py"
disable_error_code = ["import-untyped"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"
